<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fashion-MNIST Embedding Explorer</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
</head>
<body>
  <header>
    <h1>Fashion-MNIST: layer-by-layer embeddings</h1>
    <label>Model
      <select id="model">
        <option value="cnn">CNN</option>
        <option value="mlp">MLP</option>
        <option value="transformer">Transformer</option>
        <option value="logit_vit">Logit-ViT (d=10)</option>
      </select>
    </label>
    <button id="showErr" class="toggle" aria-pressed="false">Show misclassified</button>
    <span id="status"></span>
  </header>
  <main id="app"></main>
  <details id="matrixBox" open>
    <summary>Confusion matrix (test set)</summary>
    <div id="matrix">
      <svg id="matrixSvg"></svg>
      <div class="info">
        <p>Rows are the actual class, columns the predicted class. Diagonal cells (grey) are correct predictions. Red shade shows what share of the actual class went to that wrong label.</p>
        <p id="pairInfo"></p>
      </div>
    </div>
  </details>

  <script src="script.js"></script>
</body>
</html>
